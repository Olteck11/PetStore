name: Build PetStore APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Accept Android SDK Licenses
        run: |
          mkdir -p "$ANDROID_HOME/licenses"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" --licenses > /dev/null || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Ensure Manifest Exists and Assemble Debug APK
        run: |
          SETTINGS_FILE=$(find . -maxdepth 5 \( -name "settings.gradle" -o -name "settings.gradle.kts" \) | head -n 1)
          if [ -z "$SETTINGS_FILE" ]; then
            echo "No se encontro settings.gradle ni settings.gradle.kts en el repositorio."
            exit 1
          fi
          GRADLE_DIR=$(dirname "$SETTINGS_FILE")
          echo "Usando directorio Gradle: $GRADLE_DIR"

          EXISTING_MANIFEST=$(find . -maxdepth 7 -name "AndroidManifest.xml" | head -n 1)
          TARGET_MANIFEST="/home/runner/work/PetStore/PetStore/PetStore/PetStore/AndroidManifest.xml"
          mkdir -p "$(dirname "$TARGET_MANIFEST")"

          if [ -n "$EXISTING_MANIFEST" ] && [ "$EXISTING_MANIFEST" != "$TARGET_MANIFEST" ]; then
            cp "$EXISTING_MANIFEST" "$TARGET_MANIFEST"
          elif [ ! -f "$TARGET_MANIFEST" ]; then
            python3 -c '
manifest = """<?xml version="1.0" encoding="utf-8"?>
<manifest xmlns:android="http://schemas.android.com/apk/res/android">
    <application
        android:allowBackup="true"
        android:label="PetStore"
        android:supportsRtl="true"
        android:theme="@android:style/Theme.DeviceDefault.Light.NoActionBar">
        <activity
            android:name=".MainActivity"
            android:exported="true">
            <intent-filter>
                <action android:name="android.intent.action.MAIN" />
                <category android:name="android.intent.category.LAUNCHER" />
            </intent-filter>
        </activity>
    </application>
</manifest>
"""
with open("/home/runner/work/PetStore/PetStore/PetStore/PetStore/AndroidManifest.xml", "w", encoding="utf-8") as f:
    f.write(manifest)
'
          fi

          cd "$GRADLE_DIR"
          if [ ! -f "./gradlew" ]; then
            gradle wrapper --gradle-version 8.7
          fi
          chmod +x ./gradlew
          ./gradlew assembleDebug -Pandroid.useAndroidX=true --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: PetStore-debug-apk
          path: "**/build/outputs/apk/debug/*.apk"
