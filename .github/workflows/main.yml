name: Build PetStore APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Accept Android SDK Licenses
        run: |
          mkdir -p "$ANDROID_HOME/licenses"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" --licenses > /dev/null || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build Debug APK
        run: |
          TARGET="/home/runner/work/PetStore/PetStore/PetStore/PetStore/AndroidManifest.xml"
          mkdir -p "$(dirname "$TARGET")"
          SRC=$(find . -name "AndroidManifest.xml" | head -n 1)
          if [ -n "$SRC" ] && [ "$SRC" != "$TARGET" ]; then
            cp "$SRC" "$TARGET"
          fi
          GRADLE_DIR=$(dirname "$(find . -name "settings.gradle" -o -name "settings.gradle.kts" | head -n 1)")
          cd "$GRADLE_DIR"
          if [ ! -f "./gradlew" ]; then
            gradle wrapper --gradle-version 8.7
          fi
          chmod +x ./gradlew
          ./gradlew assembleDebug -Pandroid.useAndroidX=true --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: PetStore-debug-apk
          path: "**/build/outputs/apk/debug/*.apk"
